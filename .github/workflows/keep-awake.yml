name: Keep Streamlit app awake

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours
  workflow_dispatch:          # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visit the app (and wake it if asleep)
        run: |
          cat > ping.py <<'EOF'
          from playwright.sync_api import sync_playwright
          URL = "https://xmlfeedgenerator.streamlit.app/?keepalive=1"
          with sync_playwright() as p:
              page = p.chromium.launch().new_page()
              page.goto(URL, timeout=90000)
              page.wait_for_timeout(5000)
              btn = page.get_by_role("button", name="Yes, get this app back up!")
              if btn.count() > 0:
                  print("App was asleep - waking it up")
                  btn.first.click()
                  page.wait_for_timeout(60000)
              else:
                  print("App is awake")
              page.wait_for_timeout(15000)
          EOF
          python ping.py
